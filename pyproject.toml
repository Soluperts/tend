[project]
name = "tend"
version = "0.1.0"
description = "Personal AI assistant for desk workers (Raspberry Pi voice agent)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "aiohttp>=3.9",
    "croniter>=1.4",
    "loguru>=0.7",
    "openwakeword>=0.4",
    "pipecat-ai[whisper,piper,silero,local,deepgram,elevenlabs]>=1.1",
    "pipecat-ai-subagents==0.4.0",
    "rapidfuzz>=3.0",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
]

[project.scripts]
tend = "tend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tend._defaults" = ["**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
