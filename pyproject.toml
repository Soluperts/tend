[project]
name = "tend"
version = "0.1.0"
description = "Personal AI assistant for desk workers (Raspberry Pi voice agent)"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "anthropic>=0.40",
    "aiohttp>=3.9",
    "croniter>=1.4",
    "loguru>=0.7",
    "openwakeword>=0.4",
    "pipecat-ai[whisper,silero,local,deepgram,elevenlabs]>=1.1",
    'pipecat-ai[piper]>=1.1; platform_system == "Linux"',
    "pipecat-ai-subagents==0.4.0",
    "rapidfuzz>=3.0",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13.0",
    "keyring>=24.0",
    "pyaec>=1.0.1",
    'pyobjc-framework-AVFoundation>=10; platform_system == "Darwin"',
]

[project.optional-dependencies]
aec-webrtc = ["webrtc-audio-processing>=0.1.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
]

[project.scripts]
tend = "tend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tend._defaults" = ["**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
