[project]
name = "tend-assistant"
version = "0.1.0"
description = "Personal AI assistant for desk workers (Raspberry Pi / macOS voice agent)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ridhwan Luthra" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40",
    "aiohttp>=3.9",
    "croniter>=1.4",
    "loguru>=0.7",
    "openwakeword>=0.4",
    "pipecat-ai[whisper,silero,local,deepgram,elevenlabs]>=1.1",
    'pipecat-ai[piper]>=1.1; platform_system == "Linux"',
    "pipecat-ai-subagents==0.4.0",
    "rapidfuzz>=3.0",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13.0",
    "keyring>=24.0",
    "pyaec>=1.0.1",
    'pyobjc-framework-AVFoundation>=10; platform_system == "Darwin"',
]

[project.optional-dependencies]
aec-webrtc = ["webrtc-audio-processing>=0.1.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
]

[project.scripts]
tend = "tend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
