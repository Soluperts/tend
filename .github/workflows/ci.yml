name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: uv sync --frozen --extra dev

      # Audio tests are skipped here for two reasons: (1) they need PortAudio
      # and an audio device, neither of which exists on the GitHub Linux
      # runner, and (2) on a dev Mac the pyaudio extension occasionally
      # segfaults the test runner. Integration tests need real cloud keys
      # and are gated by the integration directory.
      #
      # The --deselect list is the explicit backlog of pre-existing test
      # failures that landed before CI was set up. Each is tracked in the
      # repo's issue tracker; remove from this list as each gets fixed.
      - name: pytest
        run: |
          uv run --frozen pytest \
            --ignore=tests/audio \
            --ignore=tests/integration \
            --ignore=tests/test_audio_av_audio.py \
            --ignore=tests/test_audio_aec.py \
            --ignore=tests/test_audio_channels_select_path.py \
            --ignore=tests/test_audio_output_tap.py \
            --deselect tests/test_cli.py::test_webhook_test_unconfigured_token \
            --deselect tests/test_cli_no_keyring_on_import.py::test_accessing_settings_singleton_does_call_keyring \
            --deselect tests/test_cli_setup.py::test_setup_creates_workspace_and_writes_secrets \
            --deselect tests/test_cli_setup.py::test_setup_skips_secret_prompts_when_already_set \
            --deselect tests/test_cli_setup.py::test_setup_writes_webhook_token_with_url_safe_chars \
            --deselect tests/test_scheduler.py::test_add_job_invalid_tz_does_not_persist \
            --deselect tests/test_services_make_tts.py::test_make_tts_auto_macos_avfoundation_missing_with_eleven_key \
            --deselect tests/test_services_make_tts.py::test_make_tts_auto_macos_no_options_raises \
            --deselect tests/test_workspace_lifecycle.py::test_tend_no_workspace_exits_with_message

      - name: uv build (packaging smoke)
        run: uv build

      - name: tend --help (CLI smoke — guards against keychain-on-import regressions)
        run: uv run --frozen tend --help
