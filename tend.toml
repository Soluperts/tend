# tend default settings — overridable by .env (secrets) and TEND_* env vars

# LLM brain
llm_model = "claude-haiku-4-5"

# STT
deepgram_model = "nova-3-general"
whisper_model = "tiny.en"

# TTS
elevenlabs_voice_id = "4cYYCJZtDFOV61Rs1Eoa"
elevenlabs_model = "eleven_turbo_v2_5"
piper_voice = "en_US-ryan-high"

# Audio
sample_rate = 16000

# Wake / sleep
openwakeword_model = "hey_jarvis"
wake_threshold = 0.5
sleep_phrase = "goodbye"
sleep_fuzz_ratio = 0.85
awake_timeout_s = 30

# Day-session
daily_reset_time = "04:00"
soul_path = "soul.md"

# Logging
log_path = "tend.log"

# Worker config — see docs/superpowers/specs/2026-05-06-claude-cli-workers-design.md
[workers.general]
model = "claude-opus-4-7"
setting_sources = "user,project,local"
allowed_tools = ["Read", "Edit", "Write", "Bash", "Grep", "Glob"]
# Persistent workspace where the worker builds and accumulates artifacts.
# All tasks share this directory — no per-job isolation.
workspace_dir = "~/.tend/workspace"

[scheduler]
heartbeat_every = "off"
missed_at_policy = "run-on-restart"

[webhook]
host = "127.0.0.1"
port = 7331

[announcer]
default_cooldown_s = 300

[announcer.category]
posture = 600
hydration = 900

[google]
watched_calendars = ["tend", "primary"]

[google.events.deep-work]
upcoming_lead = "5m"
emit = ["upcoming", "starting", "ended"]

[google.events.lunch]
upcoming_lead = "60m"
emit = ["upcoming", "starting"]

[google.events.exercise]
upcoming_lead = "15m"
emit = ["upcoming", "starting", "ended"]

[google.events.break]
upcoming_lead = "0m"
emit = ["starting"]
